<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 44" fill="none" width="212" height="44">
  <!-- Brand Icon -->
  <g transform="translate(1, 2)">
    <!-- Layer 1: Back Violet Squircle -->
    <rect x="8" y="3" width="30" height="30" rx="8" fill="#8B5CF6" transform="rotate(7 23 18)" opacity="0.85" />
    
    <!-- Layer 2: Middle Coral Squircle -->
    <rect x="4" y="5" width="30" height="30" rx="8" fill="#F43F5E" transform="rotate(-4 19 20)" opacity="0.9" />
    
    <!-- Layer 3: Front Dark Squircle Card -->
    <rect x="2" y="6" width="32" height="32" rx="9" fill="#13172E" stroke="#334155" stroke-width="1.2" />
    
    <!-- Inner Card Glow -->
    <rect x="3.2" y="7.2" width="29.6" height="29.6" rx="7.8" fill="none" stroke="#64748B" stroke-width="0.6" opacity="0.4" />

    <!-- Mint Checkmark -->
    <path d="M9.5 22.5 L16 28.5 L25.5 14.5" fill="none" stroke="#10B981" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Amber Accent Dot -->
    <circle cx="26" cy="14" r="2" fill="#F59E0B" />
  </g>

  <!-- Wordmark: "PreLaunch" in High-Contrast Pure White -->
  <text x="46" y="29.5" font-family="'Sora', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" letter-spacing="-0.03em" fill="#FFFFFF">PreLaunch</text>

  <!-- Badge: "QA" in Vibrant Mint Green Pill -->
  <g transform="translate(164, 10)">
    <rect width="40" height="24" rx="6.5" fill="#10B981" />
    <text x="20" y="17" font-family="'Sora', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="0.01em" fill="#090D16" text-anchor="middle">QA</text>
  </g>
</svg>
